name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: PHP Lint
        run: composer run-script lint

      - name: PHP CodeSniffer
        run: composer run-script phpcs

      - name: PHPStan
        run: composer run-script phpstan

      - name: PHP Copy/Paste Detector
        run: composer run-script phpcpd

      - name: Composer Audit
        run: composer audit

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-dev --optimize-autoloader

      - name: Verify vendor directory exists
        run: |
          if [ ! -d "vendor" ]; then
            echo "Error: vendor directory not created"
            exit 1
          fi
          echo "Vendor directory created successfully"

      - name: Check for required files
        run: |
          required_files=(
            "nova-checkout.php"
            "includes/Settings.php"
            "includes/Prices.php"
            "includes/REST.php"
            "includes/Webhooks.php"
            "includes/helpers.php"
            "vendor/autoload.php"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file not found"
              exit 1
            fi
          done
          
          echo "All required files present"

      - name: Create release artifact
        run: |
          mkdir -p build
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' --exclude='node_modules' --exclude='.DS_Store' . build/nova-checkout/
          cd build
          zip -r nova-checkout.zip nova-checkout/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-checkout-php-${{ github.sha }}
          path: build/nova-checkout.zip
          retention-days: 30

